<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="robots" content="noindex">
  <title>REP:ORT 인기 인증 열기</title>
  <link rel="icon" href="../assets/app-icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height:100svh;margin:0;display:grid;place-items:center;padding:28px;background:#0b0b0e;color:#f5f5f2;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center; }
    main { display:grid;justify-items:center; }
    img { width:82px;height:82px;border-radius:22px;box-shadow:0 18px 46px rgba(0,0,0,.45); }
    h1 { margin:18px 0 7px;font-size:1.55rem;letter-spacing:-.04em; }
    h1 span { color:#ffb719; }
    p { margin:0;color:#9b9ba8; }
    i { width:96px;height:4px;margin-top:24px;overflow:hidden;border-radius:999px;background:#24242b; }
    i::after { content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#ffb719;animation:loading 820ms ease-in-out infinite alternate; }
    @keyframes loading { to { transform:translateX(138%); } }
  </style>
</head>
<body>
  <main>
    <img src="../assets/app-icon.png" alt="">
    <h1>REP<span>:</span>ORT</h1>
    <p>공유된 인기 인증을 여는 중이에요.</p>
    <i aria-hidden="true"></i>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const ids = String(params.get("posts") || "").split(",").filter(id => /^\d+$/.test(id)).slice(0, 3);
      const fallback = new URL("../", location.href);
      fallback.searchParams.set("mode", ids.length ? "popular" : "invite");
      if (ids.length) {
        params.forEach((value, key) => {
          if (key !== "mode" && key !== "fallback") fallback.searchParams.set(key, value);
        });
        fallback.searchParams.set("posts", ids.join(","));
        fallback.searchParams.set("fallback", "1");
      }
      location.replace(fallback.href);
    })();
  </script>
</body>
</html>
